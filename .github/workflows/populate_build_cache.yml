on:
  push:
    branches:
      # Potentially run this workflow whenever the master branch changes in,
      # order to update the cache if necessary.
      - master
    paths:
      # We only need to run this if there were changes to files that affect
      # the cache key.
      - 'Cargo.lock'
      - '**/Cargo.toml'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
  # Run once per day to ensure the cache is populated even if we haven't
  # modified Cargo.lock or Cargo.toml in a while.
  schedule:
    - cron: "0 8 * * 1-5" # Run every weekday at 3am EST.
  workflow_dispatch:

name: Populate Build Cache

jobs:
  populate_build_cache:
    name: CI
    if: github.repository_owner == 'warpdotdev'
    # ci.yml's `tests` and `remote-server-tests` jobs request `id-token: write`
    # (GCP Workload Identity Federation). A caller of a reusable workflow must
    # grant every permission the nested jobs request, otherwise the run fails
    # at startup ("startup_failure") before the `if` above is even evaluated.
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    secrets: inherit
